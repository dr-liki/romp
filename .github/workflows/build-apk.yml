name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build Vite web bundle
        run: |
          npm install
          npm run build

      - name: Wrap web bundle with Capacitor Android
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Romp" "com.harsha20599.romp" --web-dir=dist
          npx cap add android

      - name: Configure AndroidManifest permissions for MediaPipe camera & WebGL
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|  <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n\n    <application android:hardwareAccelerated="true"|' "$MANIFEST"
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: romp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
